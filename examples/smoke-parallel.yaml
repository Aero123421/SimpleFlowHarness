# parallel / foreach のクロスプラットフォームスモークテスト(AI呼び出しなし)。
#   sfh run examples/smoke-parallel.yaml -v
# 固定文字列cmdはplatform shellで動かし、動的なforeach入力は実行されるcommandへ
# 混ぜない。parallel集約 -> foreach fan-out -> member投票までを一気に確認する。
api_version: 1
name: smoke2

vars:
  hypos: |
    alpha
    beta
    gamma

steps:
  # 3並列で実行し、出力は "--- id ---" 区切りで集約される
  - id: fan
    max_parallel: 3
    notes: append
    parallel:
      - id: fan_a
        cmd: "echo idea-A for demo"
      - id: fan_b
        cmd: "echo idea-B for demo"
      - id: fan_c
        cmd: "echo idea-C for demo"
    route:
      - when_contains: "idea-B"
        goto: verify
      - goto: fail

  # varsの複数行リストを1行1項目に分割してfan-out。fixture commandは固定で、
  # itemを実行文字列へ流さない。
  - id: verify
    foreach:
      from: "{{vars.hypos}}"
    max_parallel: 2
    cmd: "echo checked"
    route:
      - when_members:
          all: true
          last_line_is: "checked"
        goto: merge
      - goto: fail

  # fanのnotesとverifyの集約成果物はrun dirへ残る。
  - id: merge
    cmd: "echo smoke2-complete"

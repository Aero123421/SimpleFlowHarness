# yaml-language-server: $schema=https://raw.githubusercontent.com/Aero123421/SimpleFlowHarness/v2.0.0/schema/flow.schema.json
# Pattern: production evidence -> reproducible eval -> minimal fix -> regression suite.
api_version: 1
name: ponytail-production-failure-to-eval

workspace:
  mode: git-worktree
  cleanup: auto

contexts:
  incident: {file: ./inputs/INCIDENT.md}
  acceptance: {file: ./inputs/ACCEPTANCE.md}
  project_rules:
    file: ./inputs/PROJECT_RULES.md
    optional: true
  ponytail: {file: ./prompts/ponytail-core.md}
  planning: {file: ./prompts/planner.md}
  correctness: {file: ./prompts/correctness-review.md}
  latest_review:
    template: |
      {{steps.review.output | optional | truncate:18000}}
  latest_failure:
    template: |
      reproduction: {{steps.prove_failure.output | optional | truncate:5000}}
      exit={{steps.prove_failure.exit | optional}} stderr={{steps.prove_failure.stderr_file | optional}}
      focused: {{steps.targeted_eval.output | optional | truncate:5000}}
      exit={{steps.targeted_eval.exit | optional}} stderr={{steps.targeted_eval.stderr_file | optional}}
      regression: {{steps.full_regression.output | optional | truncate:5000}}
      exit={{steps.full_regression.exit | optional}} stderr={{steps.full_regression.stderr_file | optional}}
      review: {{steps.review.output | optional | truncate:5000}}

profiles:
  analyst: {tool: codex, access: read}
  builder: {tool: pi, access: write}
  reviewer: {tool: codex, access: read}

defaults:
  max_total_steps: 36
  max_prompt_chars: 120000
  max_context_chars: 90000

steps:
  - id: analyze_trace
    use: analyst
    effects: read
    context: [incident, acceptance, project_rules, ponytail, planning]
    prompt: |
      Turn the production evidence into one scoped, reproducible failure.
      Trace provenance from input through the incorrect result and identify the
      narrowest eval/test that captures the practitioner or user correction.
      Do not edit files.
    route:
      - {goto: add_eval}

  - id: add_eval
    allow_empty: true
    use: builder
    effects: workspace
    context: [incident, acceptance, project_rules, ponytail]
    prompt: |
      Also create tools/check_incident.py: run the focused regression and inspect
      its assertion evidence against the incident. Exit 0 if it passes, 20 only
      for the confirmed incident failure, and 2 if inspection cannot complete.
      With --regression, run the full suite: 20 requires actual failing assertions.
      Print expected/observed evidence. Never map arbitrary nonzero to 20.
      Add the smallest regression eval or test that reproduces the real failure.
      Do not implement the fix yet. Keep source evidence and expected correction
      visible in the test.

      Trace analysis:
      {{steps.analyze_trace.output | truncate:18000}}
    route:
      - {goto: prove_failure}

  # tools/check_incident.py is project-specific, created with the regression.
  # 0 = checks pass; 20 = verified assertion failure; other = cannot inspect.
  # Before fixing, 20 must identify THIS incident, not just any failed test.
  - id: prove_failure
    effects: workspace
    cmd: ["python", "tools/check_incident.py"]
    timeout_sec: 1800
    outcomes:
      0: {result: continue, label: not_reproduced}
      20: {result: continue, label: reproduced}
    on_error: goto:stuck
    route:
      - {when_label_is: reproduced, goto: implement}
      - {goto: stuck}

  - id: implement
    use: builder
    effects: workspace
    allow_empty: true
    context: [incident, acceptance, project_rules, ponytail, latest_failure]
    prompt: |
      Implement the smallest root-cause fix that makes the new eval pass without
      teaching only the recorded example. Reuse the existing pipeline and preserve provenance.
    route:
      - {goto: targeted_eval}

  - id: targeted_eval
    effects: workspace
    cmd: ["python", "tools/check_incident.py"]
    timeout_sec: 1800
    outcomes:
      0: {result: continue, label: checks_passed}
      20: {result: continue, label: checks_failed}
    on_error: goto:stuck
    route:
      - {when_label_is: checks_failed, goto: fix}
      - {when_label_is: checks_passed, goto: full_regression}
      - {goto: stuck}

  - id: full_regression
    effects: workspace
    cmd: ["python", "tools/check_incident.py", "--regression"]
    timeout_sec: 1800
    outcomes:
      0: {result: continue, label: checks_passed}
      20: {result: continue, label: checks_failed}
    on_error: goto:stuck
    route:
      - {when_label_is: checks_failed, goto: fix}
      - {when_label_is: checks_passed, goto: review}
      - {goto: stuck}

  - id: review
    use: reviewer
    effects: read
    context: [incident, acceptance, project_rules, correctness, latest_failure]
    prompt: |
      Verify the production trace, regression eval, generalization, and current code.
      End with exactly REVIEW: PASS or REVIEW: REVISE.
    route:
      - {when_last_line_is: "REVIEW: PASS", goto: end}
      - {when_last_line_is: "REVIEW: REVISE", goto: fix}
      - {goto: stuck}

  - id: fix
    use: builder
    effects: workspace
    allow_empty: true
    context: [incident, acceptance, project_rules, ponytail, latest_review, latest_failure]
    max_visits: 3
    on_max_visits: goto:stuck
    prompt: |
      Correct only the remaining regression or generalization blocker.
      Do not add a broad framework around one production case.
    route:
      - {goto: targeted_eval}

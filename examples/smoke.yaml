# AIを一切呼ばないクロスプラットフォームのスモークテスト。
# 固定文字列のcmdはWindowsではcmd /C、Unixではsh -cで実行される。動的な値を
# コマンドへ渡す実フローでは、安全な配列形式を使うこと。
#   sfh run examples/smoke.yaml
# draft が2回実行され、3回目の入場をon_max_visitsでverdictへ着地させる。
# verdictのrouteではvars templateも検査する。
api_version: 1
name: smoke

vars:
  topic: hello

steps:
  - id: draft
    cmd: "echo draft"
    max_visits: 2
    on_max_visits: goto:verdict
    route: [{ goto: draft }]

  - id: verdict
    cmd: "echo hello VERDICT: OK"
    route:
      - when_contains: "{{vars.topic}}"
        goto: end
      - goto: fail

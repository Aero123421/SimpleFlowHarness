[package]
name = "sfh"
version = "1.0.0"
edition = "2021"
description = "SimpleFlowHarness - chain AI CLI agents (codex / claude / opencode / grok / agy / pi / cursor / any command) into staged flows"
license = "MIT"
repository = "https://github.com/Aero123421/SimpleFlowHarness"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[profile.release]
opt-level = 3
lto = true
strip = true

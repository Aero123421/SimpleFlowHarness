[package]
name = "sfh"
version = "1.6.0"
edition = "2021"
rust-version = "1.85"
description = "SimpleFlowHarness - chain AI CLI agents (codex / claude / opencode / grok / agy / pi / cursor / any command) into staged flows"
license = "MIT"
authors = ["Aero123421"]
repository = "https://github.com/Aero123421/SimpleFlowHarness"
homepage = "https://github.com/Aero123421/SimpleFlowHarness"
readme = "README.md"
keywords = ["ai", "cli", "workflow", "orchestration", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[profile.release]
opt-level = 3
lto = true
strip = true

# yaml-language-server: $schema=https://raw.githubusercontent.com/Aero123421/SimpleFlowHarness/v2.0.0/schema/flow.schema.json
api_version: 1
name: failure-to-regression-eval

workspace: {mode: git-worktree, cleanup: keep}

contexts:
  incident: {file: ./INCIDENT.md}
  acceptance: {file: ./ACCEPTANCE.md}
  latest_failure:
    template: |
      reproduction: {{steps.reproduce.output | optional | truncate:5000}}
      exit={{steps.reproduce.exit | optional}} stderr={{steps.reproduce.stderr_file | optional}}
      focused: {{steps.focused.output | optional | truncate:5000}}
      exit={{steps.focused.exit | optional}} stderr={{steps.focused.stderr_file | optional}}
      regression: {{steps.regression.output | optional | truncate:5000}}
      exit={{steps.regression.exit | optional}} stderr={{steps.regression.stderr_file | optional}}
      review: {{steps.review.output | optional | truncate:5000}}

profiles:
  engineer: {tool: pi, access: write}
  reviewer: {tool: codex, access: read}

steps:
  - id: write_eval
    allow_empty: true
    use: engineer
    effects: workspace
    context: [incident, acceptance]
    prompt: |
      Also create tools/check_incident.py: run the focused regression and inspect
      its assertion evidence against the incident. Exit 0 if it passes, 20 only
      for the confirmed incident failure, and 2 if inspection cannot complete.
      With --regression, run the full suite: 20 requires actual failing assertions.
      Print expected/observed evidence. Never map arbitrary nonzero to 20.
      Add the smallest deterministic regression test or fixture reproducing the
      incident. Do not fix production code yet.
    route: [{goto: reproduce}]

  # tools/check_incident.py is project-specific, created with the regression.
  # 0 = checks pass; 20 = verified assertion failure; other = cannot inspect.
  # Before fixing, 20 must identify THIS incident, not just any failed test.
  - id: reproduce
    effects: workspace
    cmd: ["python", "tools/check_incident.py"]
    timeout_sec: 1800
    outcomes:
      0: {result: continue, label: not_reproduced}
      20: {result: continue, label: reproduced}
    on_error: goto:stuck
    route:
      - {when_label_is: reproduced, goto: fix}
      - {goto: stuck}

  - id: fix
    use: engineer
    effects: workspace
    allow_empty: true
    context: [incident, acceptance, latest_failure]
    max_visits: 3
    on_max_visits: goto:handoff
    prompt: |
      Fix the shared root cause while keeping the regression test unchanged.
    route:
      - {goto: focused}

  - id: focused
    effects: workspace
    cmd: ["python", "tools/check_incident.py"]
    timeout_sec: 1800
    outcomes:
      0: {result: continue, label: checks_passed}
      20: {result: continue, label: checks_failed}
    on_error: goto:stuck
    route:
      - {when_label_is: checks_failed, goto: fix}
      - {when_label_is: checks_passed, goto: regression}
      - {goto: stuck}

  - id: regression
    effects: workspace
    cmd: ["python", "tools/check_incident.py", "--regression"]
    timeout_sec: 1800
    outcomes:
      0: {result: continue, label: checks_passed}
      20: {result: continue, label: checks_failed}
    on_error: goto:stuck
    route:
      - {when_label_is: checks_failed, goto: fix}
      - {when_label_is: checks_passed, goto: review}
      - {goto: stuck}

  - id: review
    use: reviewer
    effects: read
    context: [incident, acceptance, latest_failure]
    prompt: |
      Verify the eval failed before the fix for the right reason, passes now,
      and the patch addresses the root cause without fixture-specific cheating.
      End with exactly REVIEW: PASS or REVIEW: REVISE.
    route:
      - {when_last_line_is: "REVIEW: PASS", goto: end}
      - {when_last_line_is: "REVIEW: REVISE", goto: fix}
      - {goto: stuck}

  - id: handoff
    use: reviewer
    effects: read
    context: [incident, acceptance, latest_failure]
    prompt: |
      Produce a handoff explaining whether reproduction, the fix, or regression
      proof is missing and give the next smallest action.
    route:
      - {goto: stuck}

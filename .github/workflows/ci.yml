name: ci

on:
  push:
    # Every branch, not just main. v1.0.0 shipped a binary that did not compile
    # on Linux or macOS because the work branch was never pushed and CI only ran
    # on main: three OS runners that nothing reaches are not a gate.
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: cargo package --locked
      - name: Smoke flows (no AI calls)
        shell: bash
        run: |
          set -e
          ./target/release/sfh --version
          ./target/release/sfh run examples/smoke.yaml -q
          ./target/release/sfh run examples/smoke-parallel.yaml -q
          for f in examples/*.yaml; do ./target/release/sfh validate "$f"; done
      - name: Engine behaviour (fake tools, no AI calls)
        shell: bash
        run: bash tests/engine_behaviour.sh ./target/release/sfh
      # Written from the attack descriptions alone rather than alongside the
      # fixes, and kept deliberately separate from the suite above. Its value is
      # that it was baselined against the PRE-fix binary and failed there - a
      # check that passes on the unfixed build is not testing anything.
      - name: Independent security checks
        shell: bash
        run: bash tests/independent_checks.sh ./target/release/sfh
      - name: Public schemas are valid JSON
        shell: bash
        run: |
          for schema in schema/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$schema"
          done

  install-docs:
    # The README's install commands must actually work on a clean machine.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and package the way release.yml does
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked
          mkdir pkg && cp target/release/sfh README.md README.en.md LICENSE pkg/
          tar czf sfh-test.tar.gz -C pkg sfh README.md README.en.md LICENSE
          shasum -a 256 sfh-test.tar.gz > sfh-test.tar.gz.sha256
      - name: Extract exactly like the README says
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c sfh-test.tar.gz.sha256
          else
            shasum -a 256 -c sfh-test.tar.gz.sha256
          fi
          mkdir extract && cd extract
          tar xzf ../sfh-test.tar.gz sfh
          ./sfh --version

  install-docs-windows:
    # Keep the PowerShell checksum, extraction, PATH, and invocation sequence
    # executable rather than leaving the most common install path as prose.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and package the way release.yml does
        shell: pwsh
        run: |
          cargo build --release --locked
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item target/release/sfh.exe pkg/
          Copy-Item README.md, README.en.md, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath sfh-test.zip -Force
          $hash = (Get-FileHash sfh-test.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  sfh-test.zip`n" | Out-File -Encoding ascii -NoNewline sfh-test.zip.sha256
      - name: Install exactly like the README says
        shell: pwsh
        run: |
          $asset = "sfh-test.zip"
          $installDir = Join-Path $PWD "installed"
          $expected = ((Get-Content "$asset.sha256" -Raw) -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 mismatch: expected $expected, got $actual" }
          New-Item -ItemType Directory -Force $installDir | Out-Null
          Expand-Archive $asset -DestinationPath $installDir -Force
          $env:Path = "$installDir;$env:Path"
          sfh --version

name: ci

on:
  push:
    # Every branch, not just main. v1.0.0 shipped a binary that did not compile
    # on Linux or macOS because the work branch was never pushed and CI only ran
    # on main: three OS runners that nothing reaches are not a gate.
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: cargo package --locked
      - name: Distribution metadata checks
        run: python3 tests/distribution_checks.py
      - name: Unix installer syntax
        shell: bash
        run: sh -n installers/sfh-installer.sh
      - name: Smoke flows (no AI calls)
        shell: bash
        run: |
          set -e
          ./target/release/sfh --version
          ./target/release/sfh run examples/smoke.yaml -q
          ./target/release/sfh run examples/smoke-parallel.yaml -q
          for f in examples/*.yaml; do ./target/release/sfh validate "$f"; done
      - name: Engine behaviour (fake tools, no AI calls)
        shell: bash
        run: bash tests/engine_behaviour.sh ./target/release/sfh
      # Written from the attack descriptions alone rather than alongside the
      # fixes, and kept deliberately separate from the suite above. Its value is
      # that it was baselined against the PRE-fix binary and failed there - a
      # check that passes on the unfixed build is not testing anything.
      - name: Independent security checks
        shell: bash
        run: bash tests/independent_checks.sh ./target/release/sfh
      - name: Public schemas are valid JSON
        shell: bash
        run: |
          for schema in schema/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$schema"
          done

  install-docs:
    # The README's install commands must actually work on a clean machine.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: cargo build --release --locked
      - name: Install and reject corrupted release
        shell: bash
        run: bash tests/installer_unix.sh ./target/release/sfh

  install-docs-windows:
    # Keep the PowerShell checksum, extraction, PATH, and invocation sequence
    # executable rather than leaving the most common install path as prose.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: cargo build --release --locked
      - name: Install and reject corrupted release
        shell: pwsh
        run: ./tests/installer_windows.ps1 -Binary ./target/release/sfh.exe

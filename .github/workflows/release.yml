name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: sfh-windows-x64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: sfh-macos-arm64.tar.gz
          # Intel Mac is cross-built from the arm64 runner: the macos-13
          # runner pool queues for tens of minutes or never starts.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: sfh-macos-x64.tar.gz
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: sfh-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: sfh-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir pkg
          cp target/${{ matrix.target }}/release/sfh pkg/
          cp README.md LICENSE pkg/
          # Flat member names ("sfh", not "./sfh") so `tar xz sfh` works with GNU tar too.
          tar czf ${{ matrix.asset }} -C pkg sfh README.md LICENSE
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          # Verify the archive the way the README tells users to extract it.
          # A cross-built binary cannot run on this host, so only unpack it.
          mkdir verify && tar xzf ${{ matrix.asset }} -C verify sfh
          if [ "${{ matrix.cross }}" != "true" ]; then ./verify/sfh --version; else file verify/sfh; fi
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item target/${{ matrix.target }}/release/sfh.exe pkg/
          Copy-Item README.md, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath ${{ matrix.asset }} -Force
          $h = (Get-FileHash ${{ matrix.asset }} -Algorithm SHA256).Hash.ToLower()
          # LF, not CRLF: Out-File's default trailing CRLF makes the filename
          # unmatchable for `sha256sum -c` under Git Bash / WSL.
          "$h  ${{ matrix.asset }}`n" | Out-File -Encoding ascii -NoNewline "${{ matrix.asset }}.sha256"
          Expand-Archive ${{ matrix.asset }} -DestinationPath verify -Force
          ./verify/sfh.exe --version
      - name: Stage release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download complete release set
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

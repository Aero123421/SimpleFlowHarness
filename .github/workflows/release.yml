name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      force_full: true

  release-contract:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.contract.outputs.version }}
      release_commit: ${{ steps.contract.outputs.release_commit }}
      apple_team_id: ${{ steps.contract.outputs.apple_team_id }}
      windows_codesign_cert_sha256: ${{ steps.contract.outputs.windows_codesign_cert_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag, package, and changelog agree
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release workflow publishes stable semantic versions only" >&2
            exit 1
          }
          test "$GITHUB_REF_NAME" = "v$version"
          release_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_commit" origin/main || {
            echo "Release tags must point to a commit contained in origin/main" >&2
            exit 1
          }
          git ls-files --error-unmatch release-resources.txt >/dev/null
          git ls-files --error-unmatch release-content-manifest.txt >/dev/null
          git ls-files --error-unmatch release-signers.json >/dev/null
          git diff --quiet HEAD -- release-content-manifest.txt
          python3 scripts/release_assets.py content-manifest --check
          python3 - <<'PY' > release-signer-values.txt
          import json
          import re

          with open("release-signers.json", encoding="ascii") as stream:
              document = json.load(stream)
          expected = {
              "schema_version",
              "apple_team_id",
              "windows_codesign_cert_sha256",
          }
          apple = document.get("apple_team_id")
          windows = document.get("windows_codesign_cert_sha256")
          if (
              set(document) != expected
              or document.get("schema_version") != 1
              or (apple is not None and not re.fullmatch(r"[A-Z0-9]{10}", apple))
              or (
                  windows is not None
                  and not re.fullmatch(r"[0-9a-f]{64}", windows)
              )
          ):
              raise SystemExit("release-signers.json is incomplete or invalid")
          print(apple or "")
          print(windows or "")
          PY
          test "$(wc -l < release-signer-values.txt)" -eq 2
          apple_team_id="$(sed -n '1p' release-signer-values.txt)"
          windows_pin="$(sed -n '2p' release-signer-values.txt)"
          grep -F "## v$version " CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "apple_team_id=$apple_team_id" >> "$GITHUB_OUTPUT"
          echo "windows_codesign_cert_sha256=$windows_pin" >> "$GITHUB_OUTPUT"
      # Build from the checked-out commit, never the working tree. The complete
      # asset manifest and provenance are written after every platform packet
      # has arrived in the publish job.
      - name: Build tagged source archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.contract.outputs.version }}"
          archive="sfh-${version}-source.tar.gz"
          mkdir -p source-assets
          git archive --format=tar.gz --prefix="sfh-${version}/" -o "source-assets/${archive}" HEAD
          (cd source-assets && shasum -a 256 "$archive" > "$archive.sha256")
      - name: Stage source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source
          path: source-assets/*
          if-no-files-found: error
          retention-days: 1

  signing-contract:
    needs: [verify, release-contract]
    runs-on: ubuntu-latest
    environment: release
    env:
      APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64_SET: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 != '' }}
      APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD_SET: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD != '' }}
      APPLE_SIGNING_IDENTITY_SET: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      APPLE_NOTARY_KEY_ID_SET: ${{ secrets.APPLE_NOTARY_KEY_ID != '' }}
      APPLE_NOTARY_ISSUER_ID_SET: ${{ secrets.APPLE_NOTARY_ISSUER_ID != '' }}
      APPLE_NOTARY_KEY_P8_BASE64_SET: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 != '' }}
      WINDOWS_CODESIGN_PFX_BASE64_SET: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 != '' }}
      WINDOWS_CODESIGN_PFX_PASSWORD_SET: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD != '' }}
      WINDOWS_CODESIGN_TIMESTAMP_URL_SET: ${{ secrets.WINDOWS_CODESIGN_TIMESTAMP_URL != '' }}
      RELEASE_ADMIN_READ_TOKEN_SET: ${{ secrets.RELEASE_ADMIN_READ_TOKEN != '' }}
    steps:
      - name: Validate optional native signing credentials
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ needs.release-contract.outputs.apple_team_id }}
          WINDOWS_CODESIGN_CERT_SHA256: ${{ needs.release-contract.outputs.windows_codesign_cert_sha256 }}
        run: |
          set -euo pipefail
          [ "$RELEASE_ADMIN_READ_TOKEN_SET" = true ] || {
            echo "Missing required Actions secret: RELEASE_ADMIN_READ_TOKEN" >&2
            exit 1
          }
          require_group() {
            label="$1"
            shift
            missing=()
            for name in "$@"; do
              state_name="${name}_SET"
              if [ "${!state_name}" != true ]; then missing+=("$name"); fi
            done
            if [ "${#missing[@]}" -ne 0 ]; then
              printf '%s signing is enabled but secrets are missing: %s\n' \
                "$label" "${missing[*]}" >&2
              exit 1
            fi
          }
          if [ -n "$APPLE_TEAM_ID" ]; then
            require_group Apple \
              APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 \
              APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD \
              APPLE_SIGNING_IDENTITY \
              APPLE_NOTARY_KEY_ID \
              APPLE_NOTARY_ISSUER_ID \
              APPLE_NOTARY_KEY_P8_BASE64
          else
            echo "Apple signer pin is unset; macOS assets will be unsigned"
          fi
          if [ -n "$WINDOWS_CODESIGN_CERT_SHA256" ]; then
            require_group Windows \
              WINDOWS_CODESIGN_PFX_BASE64 \
              WINDOWS_CODESIGN_PFX_PASSWORD \
              WINDOWS_CODESIGN_TIMESTAMP_URL
          else
            echo "Windows signer pin is unset; Windows assets will be unsigned"
          fi

  build:
    needs: [verify, release-contract, signing-contract]
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: sfh-windows-x64.zip
            run_binary: true
          - os: macos-15
            target: aarch64-apple-darwin
            asset: sfh-macos-arm64.tar.gz
            run_binary: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: sfh-macos-x64.tar.gz
            run_binary: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: sfh-linux-x64.tar.gz
            run_binary: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: sfh-linux-arm64.tar.gz
            run_binary: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Sign Windows executable
        if: runner.os == 'Windows' && needs.release-contract.outputs.windows_codesign_cert_sha256 != ''
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          WINDOWS_CODESIGN_CERT_SHA256: ${{ needs.release-contract.outputs.windows_codesign_cert_sha256 }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = (Resolve-Path 'target/${{ matrix.target }}/release/sfh.exe').Path
          $certificate = Join-Path $env:RUNNER_TEMP 'sfh-codesign.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $certificate,
              [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64)
            )
            $signTool = Get-ChildItem `
              -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe -Recurse |
              Where-Object { $_.DirectoryName -match '\\x64$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signTool) { throw 'signtool.exe was not found' }
            & $signTool sign /f $certificate `
              /p $env:WINDOWS_CODESIGN_PFX_PASSWORD `
              /fd SHA256 /tr $env:WINDOWS_CODESIGN_TIMESTAMP_URL /td SHA256 `
              /d sfh $binary
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed: $LASTEXITCODE" }
            & $signTool verify /pa /all /tw /v $binary
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed: $LASTEXITCODE" }
            $signature = Get-AuthenticodeSignature -LiteralPath $binary
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode status is not Valid: $($signature.Status)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw 'Authenticode signature has no trusted timestamp'
            }
            if ($env:WINDOWS_CODESIGN_CERT_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') {
              throw 'WINDOWS_CODESIGN_CERT_SHA256 must contain 64 hexadecimal characters'
            }
            $sha256 = [Security.Cryptography.SHA256]::Create()
            try {
              $signerHash = -join ($sha256.ComputeHash($signature.SignerCertificate.RawData) |
                ForEach-Object { $_.ToString('x2') })
            } finally {
              $sha256.Dispose()
            }
            if ($signerHash -cne $env:WINDOWS_CODESIGN_CERT_SHA256.ToLowerInvariant()) {
              throw 'Authenticode signer certificate does not match the pinned publisher'
            }
          } finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }

      - name: Import Developer ID certificate and sign macOS executable
        if: runner.os == 'macOS' && needs.release-contract.outputs.apple_team_id != ''
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ needs.release-contract.outputs.apple_team_id }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/sfh"
          certificate="$RUNNER_TEMP/sfh-developer-id.p12"
          keychain="$RUNNER_TEMP/sfh-signing.keychain-db"
          keychain_password="$(uuidgen)"
          cleanup() {
            rm -f "$certificate"
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          python3 -c 'import base64,os,sys; open(sys.argv[1], "wb").write(base64.b64decode(os.environ["APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64"], validate=True))' "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          signature="$(codesign --display --verbose=4 "$binary" 2>&1)"
          grep -F 'Authority=Developer ID Application:' <<< "$signature"
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          grep -Fx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signature"
          grep -E '^Timestamp=.+' <<< "$signature"
          ! grep -E '^Timestamp=(none|-)$' <<< "$signature"
          grep -E '^CodeDirectory .*flags=.*\(runtime\)' <<< "$signature"

      - name: Notarize macOS executable
        if: runner.os == 'macOS' && needs.release-contract.outputs.apple_team_id != ''
        shell: bash
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/sfh"
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          packet="$RUNNER_TEMP/sfh-${{ matrix.target }}-notarize.zip"
          result="$RUNNER_TEMP/sfh-${{ matrix.target }}-notary-result.json"
          cleanup() { rm -f "$api_key" "$packet" "$result"; }
          trap cleanup EXIT
          python3 -c 'import base64,os,sys; open(sys.argv[1], "wb").write(base64.b64decode(os.environ["APPLE_NOTARY_KEY_P8_BASE64"], validate=True))' "$api_key"
          chmod 600 "$api_key"
          ditto -c -k --keepParent "$binary" "$packet"
          xcrun notarytool submit "$packet" \
            --key "$api_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait --output-format json > "$result"
          python3 -c 'import json,sys; result=json.load(open(sys.argv[1], encoding="utf-8")); assert result.get("status") == "Accepted", result' "$result"

      - name: Package and verify complete release packet
        run: >-
          python scripts/release_assets.py package
          --binary target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'sfh.exe' || 'sfh' }}
          --asset ${{ matrix.asset }}
      - name: Verify packaged Windows signature
        if: runner.os == 'Windows' && needs.release-contract.outputs.windows_codesign_cert_sha256 != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:RUNNER_TEMP 'sfh-windows-signature-check'
          Expand-Archive '${{ matrix.asset }}' -DestinationPath $staging -Force
          $binary = Join-Path $staging 'sfh.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $binary
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
            throw 'Packaged executable has no valid timestamped Authenticode signature'
          }
      - name: Verify packaged macOS signature
        if: runner.os == 'macOS' && needs.release-contract.outputs.apple_team_id != ''
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/sfh-${{ matrix.target }}-signature-check"
          mkdir "$staging"
          tar xzf "${{ matrix.asset }}" -C "$staging" sfh
          codesign --verify --strict --verbose=2 "$staging/sfh"
          signature="$(codesign --display --verbose=4 "$staging/sfh" 2>&1)"
          grep -F 'Authority=Developer ID Application:' <<< "$signature"
          grep -E '^Timestamp=.+' <<< "$signature"
          ! grep -E '^Timestamp=(none|-)$' <<< "$signature"
          grep -E '^CodeDirectory .*flags=.*\(runtime\)' <<< "$signature"
      - name: Execute packaged binary
        if: matrix.run_binary
        run: >-
          python scripts/release_assets.py run-archive
          --archive ${{ matrix.asset }}
          --binary-name ${{ runner.os == 'Windows' && 'sfh.exe' || 'sfh' }}
      - name: Stage release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 1

  distribution-metadata:
    needs: [build, release-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download binary checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: binary-assets
          merge-multiple: true
      - name: Render installers and package-manager metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir release-assets
          python3 scripts/render_distribution.py \
            --version "$version" \
            --checksums-dir binary-assets \
            --output-dir generated \
            --release-assets-dir release-assets \
            --apple-team-id "$APPLE_TEAM_ID" \
            --windows-codesign-cert-sha256 "$WINDOWS_CODESIGN_CERT_SHA256"
          (
            cd release-assets
            for asset in sfh-installer.sh sfh-installer.ps1 sfh.rb; do
              shasum -a 256 "$asset" > "$asset.sha256"
            done
          )
        env:
          APPLE_TEAM_ID: ${{ needs.release-contract.outputs.apple_team_id }}
          WINDOWS_CODESIGN_CERT_SHA256: ${{ needs.release-contract.outputs.windows_codesign_cert_sha256 }}
      - name: Stage installers and package-manager metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distribution-metadata
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [distribution-metadata, release-contract]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download complete release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Write and verify complete release manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release_assets.py provenance \
            --directory dist \
            --output dist/provenance.json \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --commit "${{ needs.release-contract.outputs.release_commit }}"
          python3 scripts/release_assets.py manifest \
            --directory dist \
            --output dist/SHA256SUMS \
            --version "$version"
          python3 scripts/release_assets.py verify-manifest \
            --directory dist \
            --manifest dist/SHA256SUMS \
            --version "$version"
          python3 scripts/release_assets.py release-notes \
            --changelog CHANGELOG.md \
            --tag "$GITHUB_REF_NAME" \
            --output release-notes.md
      - name: Prove the remote release boundary before creating a draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          setting="$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases")"
          if [ "$(jq -r '.enabled' <<< "$setting")" != true ]; then
            echo "Repository release immutability must be enabled before draft creation" >&2
            exit 1
          fi
          releases="$(GH_TOKEN="$RELEASE_TOKEN" gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          existing="$(jq -r --arg tag "$GITHUB_REF_NAME" \
            '.[][] | select(.tag_name == $tag) | .id' <<< "$releases")"
          if [ -n "$existing" ]; then
            echo "A release already exists for $GITHUB_REF_NAME (ID(s): $existing); refusing to reuse or mutate it" >&2
            echo "Inspect it with: gh api repos/$GITHUB_REPOSITORY/releases/<ID>" >&2
            echo "Delete only a confirmed stale draft with: gh api --method DELETE repos/$GITHUB_REPOSITORY/releases/<ID>" >&2
            exit 1
          fi
          remote_refs="$(git ls-remote origin \
            "refs/tags/$GITHUB_REF_NAME" \
            "refs/tags/$GITHUB_REF_NAME^{}")"
          remote_sha="$(awk -v peeled="refs/tags/$GITHUB_REF_NAME^{}" \
            '$2 == peeled { print $1 }' <<< "$remote_refs")"
          if [ -z "$remote_sha" ]; then
            remote_sha="$(awk -v direct="refs/tags/$GITHUB_REF_NAME" \
              '$2 == direct { print $1 }' <<< "$remote_refs")"
          fi
          test "$remote_sha" = "${{ needs.release-contract.outputs.release_commit }}"
      - name: Create draft release and upload the complete asset set
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --rawfile body release-notes.md \
            '{tag_name:$tag,name:$tag,body:$body,draft:true,prerelease:false}')"
          release="$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases" --input - <<< "$payload")"
          release_id="$(jq -er '.id' <<< "$release")"
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
          test "$(jq -r '.draft' <<< "$release")" = true
          test "$(jq -r '.tag_name' <<< "$release")" = "$GITHUB_REF_NAME"
          upload_url="$(jq -er '.upload_url | sub("\\{\\?name,label\\}$"; "")' \
            <<< "$release")"
          test "$upload_url" = \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets"
          for asset in dist/*; do
            name="$(basename "$asset")"
            uploaded="$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@$asset" \
              "$upload_url?name=$name")"
            test "$(jq -r '.name' <<< "$uploaded")" = "$name"
            test "$(jq -r '.state' <<< "$uploaded")" = uploaded
          done
      - name: Verify the remote draft contains exactly the local asset set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -n "${{ steps.draft.outputs.id }}"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/${{ steps.draft.outputs.id }}")"
          test "$(jq -r '.draft' <<< "$release")" = true
          test "$(jq -r '.tag_name' <<< "$release")" = "$GITHUB_REF_NAME"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/${{ steps.draft.outputs.id }}/assets?per_page=100" \
            --jq '.[]' | jq -s '.' > remote-assets.json
          python3 scripts/release_assets.py verify-remote-assets \
            --directory dist \
            --manifest dist/SHA256SUMS \
            --remote-assets remote-assets.json \
            --version "$version"
      - name: Attest every release asset listed by SHA256SUMS
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest the SHA256SUMS manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
      - name: Require repository release immutability
        shell: bash
        env:
          # The immutable-releases endpoint requires repository Administration
          # read access, which the workflow GITHUB_TOKEN cannot be granted.
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          setting="$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases")"
          if [ "$(jq -r '.enabled' <<< "$setting")" != true ]; then
            echo "Repository release immutability must be enabled before publishing" >&2
            exit 1
          fi
      - name: Recheck remote asset digests immediately before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/${{ steps.draft.outputs.id }}")"
          test "$(jq -r '.draft' <<< "$release")" = true
          test "$(jq -r '.tag_name' <<< "$release")" = "$GITHUB_REF_NAME"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/${{ steps.draft.outputs.id }}/assets?per_page=100" \
            --jq '.[]' | jq -s '.' > final-remote-assets.json
          python3 scripts/release_assets.py verify-remote-assets \
            --directory dist \
            --manifest dist/SHA256SUMS \
            --remote-assets final-remote-assets.json \
            --version "$version"
          remote_refs="$(git ls-remote origin \
            "refs/tags/$GITHUB_REF_NAME" \
            "refs/tags/$GITHUB_REF_NAME^{}")"
          remote_sha="$(awk -v peeled="refs/tags/$GITHUB_REF_NAME^{}" \
            '$2 == peeled { print $1 }' <<< "$remote_refs")"
          if [ -z "$remote_sha" ]; then
            remote_sha="$(awk -v direct="refs/tags/$GITHUB_REF_NAME" \
              '$2 == direct { print $1 }' <<< "$remote_refs")"
          fi
          test -n "$remote_sha"
          test "$remote_sha" = "${{ needs.release-contract.outputs.release_commit }}"
      # The API gate proves Immutable Releases will lock the tag and assets at
      # this transition. Creation and upload stay in a draft until the exact
      # remote digests and attestations have passed.
      - name: Publish the completed draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published="$(gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/${{ steps.draft.outputs.id }}" \
            --input - <<JSON
          {"draft":false,"make_latest":"true"}
          JSON
          )"
          test "$(jq -r '.draft' <<< "$published")" = false
          test "$(jq -r '.tag_name' <<< "$published")" = "$GITHUB_REF_NAME"
          test "$(jq -r '.immutable' <<< "$published")" = true
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/${{ steps.draft.outputs.id }}/assets?per_page=100" \
            --jq '.[]' | jq -s '.' > published-assets.json
          python3 scripts/release_assets.py verify-remote-assets \
            --directory dist \
            --manifest dist/SHA256SUMS \
            --remote-assets published-assets.json \
            --version "${GITHUB_REF_NAME#v}"
      - name: Remove this run's incomplete mutable release
        if: ${{ always() && steps.draft.outputs.id != '' && (failure() || cancelled()) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/releases/${{ steps.draft.outputs.id }}"
          api="https://api.github.com/$endpoint"
          status="$(curl --silent --show-error --output cleanup-get.json \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$api")"
          if [ "$status" = 404 ]; then exit 0; fi
          if [ "$status" != 200 ]; then
            cat cleanup-get.json >&2
            exit 1
          fi
          release="$(cat cleanup-get.json)"
          test "$(jq -r '.tag_name' <<< "$release")" = "$GITHUB_REF_NAME"
          if [ "$(jq -r '.immutable' <<< "$release")" = true ]; then
            echo "The failed run published an immutable release; manual review is required" >&2
            exit 0
          fi
          status="$(curl --silent --show-error --output cleanup-delete.json \
            --write-out '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$api")"
          if [ "$status" != 204 ]; then
            cat cleanup-delete.json >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            status="$(curl --silent --show-error --output cleanup-confirm.json \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "$api")"
            if [ "$status" = 404 ]; then
              exit 0
            fi
            if [ "$status" != 200 ]; then cat cleanup-confirm.json >&2; fi
            sleep "$attempt"
          done
          echo "Incomplete mutable release still exists after cleanup" >&2
          exit 1

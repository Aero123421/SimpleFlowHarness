name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag, package, and changelog agree
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          grep -F "## v$version " CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A source archive was once distributed whose Cargo.toml disagreed with
      # its own tag, and nothing in the archive itself could prove which one
      # was wrong. This manifest lets a reviewer check a downloaded packet
      # against the tag/commit/version sfh's own release job recorded, rather
      # than trust the archive's self-description.
      - name: Write release provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.contract.outputs.version }}"
          commit="$(git rev-parse HEAD)"
          archive="sfh-${version}-source.tar.gz"
          mkdir -p provenance
          # `git archive` of the checked-out commit, not the working tree, so
          # this can never pick up an untracked or build-only file - it is the
          # exact archive a reviewer's Cargo.toml and sha256 checks are about.
          git archive --format=tar.gz --prefix="sfh-${version}/" -o "provenance/${archive}" HEAD
          archive_sha256="$(shasum -a 256 "provenance/${archive}" | cut -d ' ' -f1)"
          (cd provenance && shasum -a 256 "$archive" > "$archive.sha256")
          python3 -c 'import json,sys; print(json.dumps({"version": sys.argv[1], "tag": sys.argv[2], "commit": sys.argv[3], "archive_sha256": sys.argv[4], "generated_utc": sys.argv[5]}, indent=2))' "$version" "$GITHUB_REF_NAME" "$commit" "$archive_sha256" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > provenance/provenance.json
          cat provenance/provenance.json
      - name: Stage release provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance
          path: provenance/*
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [verify, release-contract]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: sfh-windows-x64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: sfh-macos-arm64.tar.gz
          # Intel Mac is cross-built from the arm64 runner: the macos-13
          # runner pool queues for tens of minutes or never starts.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: sfh-macos-x64.tar.gz
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: sfh-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: sfh-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir pkg
          cp target/${{ matrix.target }}/release/sfh pkg/
          cp README.md README.ja.md LICENSE pkg/
          # Flat member names ("sfh", not "./sfh") so `tar xz sfh` works with GNU tar too.
          tar czf ${{ matrix.asset }} -C pkg sfh README.md README.ja.md LICENSE
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          # Verify the archive the way the README tells users to extract it.
          # A cross-built binary cannot run on this host, so only unpack it.
          mkdir verify && tar xzf ${{ matrix.asset }} -C verify sfh
          if [ "${{ matrix.cross }}" != "true" ]; then ./verify/sfh --version; else file verify/sfh; fi
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item target/${{ matrix.target }}/release/sfh.exe pkg/
          Copy-Item README.md, README.ja.md, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath ${{ matrix.asset }} -Force
          $h = (Get-FileHash ${{ matrix.asset }} -Algorithm SHA256).Hash.ToLower()
          # LF, not CRLF: Out-File's default trailing CRLF makes the filename
          # unmatchable for `sha256sum -c` under Git Bash / WSL.
          "$h  ${{ matrix.asset }}`n" | Out-File -Encoding ascii -NoNewline "${{ matrix.asset }}.sha256"
          Expand-Archive ${{ matrix.asset }} -DestinationPath verify -Force
          ./verify/sfh.exe --version
      - name: Stage release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 1

  distribution-metadata:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download binary checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: binary-assets
          merge-multiple: true
      - name: Render installers and package-manager metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir release-assets
          cp installers/sfh-installer.sh release-assets/
          cp installers/sfh-installer.ps1 release-assets/
          python3 scripts/render_distribution.py \
            --version "$version" \
            --checksums-dir binary-assets \
            --output-dir generated \
            --release-assets-dir release-assets
          (
            cd release-assets
            for asset in sfh-installer.sh sfh-installer.ps1 sfh.rb; do
              shasum -a 256 "$asset" > "$asset.sha256"
            done
          )
      - name: Stage installers and package-manager metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distribution-metadata
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: distribution-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download complete release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
